name: Performance Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  performance-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_INITDB_ARGS: "-E UTF8"
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: 127.0.0.1:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        options: >-
          --health-cmd bin/kafka-broker-api-versions.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        options: >-
          --health-cmd echo
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Build Services
        run: mvn -B clean package -DskipTests
      
      - name: Run Performance Tests
        run: mvn -B test -Dgroups=performance
        continue-on-error: true
      
      - name: Run Benchmark Tests
        run: mvn -B test -Dgroups=benchmark
        continue-on-error: true
      
      - name: Upload Performance Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-results
          path: '**/target/performance-reports/**'
      
      - name: Comment Performance Results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            let comment = '## Performance Test Results\n\n';
            const reportDir = 'target/performance-reports';
            
            if (fs.existsSync(reportDir)) {
              const files = fs.readdirSync(reportDir);
              comment += files.length > 0 
                ? `Found ${files.length} performance test reports`
                : 'No performance test reports found';
            } else {
              comment += 'No performance test reports generated';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            }).catch(err => console.log('Could not post comment:', err))

  load-testing:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Build Services
        run: mvn -B clean package -DskipTests
      
      - name: Start Services with Docker Compose
        run: docker compose up -d
        timeout-minutes: 5
        continue-on-error: true
      
      - name: Wait for Services
        run: sleep 30
      
      - name: Run Load Tests with Apache JMeter
        run: |
          echo "Load testing would be performed here"
          # Add JMeter test scripts
        continue-on-error: true
      
      - name: Stop Services
        if: always()
        run: docker compose down
