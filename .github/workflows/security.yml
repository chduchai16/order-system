name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 2 * * 0'  # Weekly on Sunday at 2 AM

jobs:
  # Dependency check with OWASP
  dependency-check:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run dependency-check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'order-system'
          path: '.'
          format: 'JSON'
      
      - name: Upload dependency-check results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/
  
  # Java security scanning
  java-security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      
      - name: Run OWASP Maven plugin
        run: mvn -B org.owasp:dependency-check-maven:check || true
      
      - name: Upload OWASP results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-scan-results
          path: target/dependency-check-report.*
  
  # Frontend security scanning
  frontend-security-scan:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'
      
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install
      
      - name: Run npm audit
        working-directory: ./frontend
        run: npm audit --audit-level=moderate || true
      
      - name: Generate npm audit report
        working-directory: ./frontend
        run: npm audit --json > npm-audit-report.json || true
      
      - name: Upload npm audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: frontend/npm-audit-report.json
  
  # Container scanning
  container-scan:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service: ['apigateway', 'authservice', 'userservice', 'productservice', 'orderservice', 'paymentservice', 'notificationservice', 'discoveryserver']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t ${{ matrix.service }}:scan -f ${{ matrix.service }}/Dockerfile .
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ matrix.service }}:scan'
          format: 'sarif'
          output: '${{ matrix.service }}-trivy-result.sarif'
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: '${{ matrix.service }}-trivy-result.sarif'
          category: 'trivy-${{ matrix.service }}'
