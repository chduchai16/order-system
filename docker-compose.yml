services:
  postgres:
    image: postgres:15
    container_name: order-system-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    deploy:
      resources:
        limits:
          memory: 128M # Giảm từ default xuống 128MB
    networks:
      - order-network

  # Kafka (Tối ưu cực hạn cho Dev)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: order-system-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx256M" # Tăng lên 256MB để tránh OOM khi startup
    deploy:
      resources:
        limits:
          memory: 384M

    networks:
      - order-network

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: order-system-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      # Ép Keycloak chạy trong 256MB
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m" 
    ports:
      - "9090:8080"
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - order-network

  # Eureka Discovery Server
  discoveryserver:
    build:
      context: .
      dockerfile: ./discoveryserver/Dockerfile
    container_name: order-system-discoveryserver
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      # Cấu hình JVM tối ưu cho Spring Boot 3
      JAVA_TOOL_OPTIONS: "-Xms128M -Xmx192M -XX:+UseSerialGC -Xss256K"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - order-network

  # API Gateway
  apigateway:
    build:
      context: .
      dockerfile: ./apigateway/Dockerfile
    container_name: order-system-apigateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://discoveryserver:8080/eureka"
      KEYCLOAK_SERVER_URL: "${KEYCLOAK_URL:-http://keycloak:8080}"
      KEYCLOAK_ISSUER_URI: "${KEYCLOAK_URL:-http://keycloak:8080}/realms/order"
      JAVA_TOOL_OPTIONS: "-Xms128M -Xmx160M -XX:+UseSerialGC -Xss256K"
    deploy:
      resources:
        limits:
          memory: 200M
    networks:
      - order-network

  # User Service
  userservice:
    build:
      context: .
      dockerfile: ./userservice/Dockerfile
    container_name: order-system-userservice
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/user_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-postgres}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_SERVERS:-kafka:29092}"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://discoveryserver:8080/eureka"
      KEYCLOAK_SERVER_URL: "${KEYCLOAK_URL:-http://keycloak:8080}"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET}"
      JAVA_TOOL_OPTIONS: "-Xms128M -Xmx256M -XX:+UseSerialGC -Xss256K"
    deploy:
      resources:
        limits:
          memory: 320M
    networks:
      - order-network

  # Product Service
  productservice:
    build:
      context: .
      dockerfile: ./productservice/Dockerfile
    container_name: order-system-productservice
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/product_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-postgres}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_SERVERS:-kafka:29092}"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://discoveryserver:8080/eureka"
      JAVA_TOOL_OPTIONS: "-Xms128M -Xmx256M -XX:+UseSerialGC -Xss256K"
    deploy:
      resources:
        limits:
          memory: 320M
    networks:
      - order-network

  # Order Service
  orderservice:
    build:
      context: .
      dockerfile: ./orderservice/Dockerfile
    container_name: order-system-orderservice
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/order_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-postgres}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_SERVERS:-kafka:29092}"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://discoveryserver:8080/eureka"
      JAVA_TOOL_OPTIONS: "-Xms128M -Xmx256M -XX:+UseSerialGC -Xss256K"
    deploy:
      resources:
        limits:
          memory: 320M
    networks:
      - order-network

  # Payment Service
  paymentservice:
    build:
      context: .
      dockerfile: ./paymentservice/Dockerfile
    container_name: order-system-paymentservice
    ports:
      - "8084:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/payment_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-postgres}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_SERVERS:-kafka:29092}"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://discoveryserver:8080/eureka"
      JAVA_TOOL_OPTIONS: "-Xms128M -Xmx256M -XX:+UseSerialGC -Xss256K"
    deploy:
      resources:
        limits:
          memory: 320M
    networks:
      - order-network

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: order-system-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_GATEWAY_URL: "${NEXT_PUBLIC_API_GATEWAY_URL:-http://apigateway:8080}"
      NEXT_PUBLIC_KEYCLOAK_URL: "${NEXT_PUBLIC_KEYCLOAK_URL:-http://keycloak:8080}"
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - order-network

volumes:
  postgres_data:
  kafka_data:

networks:
  order-network:
    driver: bridge
