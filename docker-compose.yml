services:
  postgres:
    image: postgres:15
    container_name: order-system-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=200"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - order-network

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: order-system-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      KAFKA_HEAP_OPTS: "-Xms256M -Xmx256M"

    volumes:
      - kafka_data:/var/lib/kafka/data

    networks:
      - order-network

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: order-system-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:-postgres}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-password}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_PORT: 8080
      JAVA_OPTS: "-Xms128m -Xmx512m"
    ports:
      - "9090:8080"
    depends_on:
      - postgres
    networks:
      - order-network

  # ==================== MICROSERVICES ====================

  # Eureka Discovery Server
  discoveryserver:
    build:
      context: .
      dockerfile: ./discoveryserver/Dockerfile
    container_name: order-system-discoveryserver
    ports:
      - "8061:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
    depends_on:
      - keycloak
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - order-network

  # API Gateway
  apigateway:
    build:
      context: .
      dockerfile: ./apigateway/Dockerfile
    container_name: order-system-apigateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://discoveryserver:8080/eureka"
      KEYCLOAK_SERVER_URL: "${KEYCLOAK_URL:-http://keycloak:8080}"
      KEYCLOAK_ISSUER_URI: "${KEYCLOAK_URL:-http://keycloak:8080}/realms/order"
    depends_on:
      - discoveryserver
      - keycloak
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - order-network

  # User Service
  userservice:
    build:
      context: .
      dockerfile: ./userservice/Dockerfile
    container_name: order-system-userservice
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/user_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-postgres}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_SERVERS:-kafka:29092}"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://discoveryserver:8080/eureka"
      KEYCLOAK_SERVER_URL: "${KEYCLOAK_URL:-http://keycloak:8080}"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET}"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discoveryserver:
        condition: service_started
      keycloak:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - order-network

  # Product Service
  productservice:
    build:
      context: .
      dockerfile: ./productservice/Dockerfile
    container_name: order-system-productservice
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/product_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-postgres}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_SERVERS:-kafka:29092}"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://discoveryserver:8080/eureka"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discoveryserver:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - order-network

  # Order Service
  orderservice:
    build:
      context: .
      dockerfile: ./orderservice/Dockerfile
    container_name: order-system-orderservice
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/order_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-postgres}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_SERVERS:-kafka:29092}"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://discoveryserver:8080/eureka"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discoveryserver:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - order-network

  # Payment Service
  paymentservice:
    build:
      context: .
      dockerfile: ./paymentservice/Dockerfile
    container_name: order-system-paymentservice
    ports:
      - "8084:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/payment_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER:-postgres}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-password}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "${KAFKA_SERVERS:-kafka:29092}"
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://discoveryserver:8080/eureka"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discoveryserver:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - order-network

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: order-system-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_GATEWAY_URL: "${NEXT_PUBLIC_API_GATEWAY_URL:-http://apigateway:8080}"
      NEXT_PUBLIC_KEYCLOAK_URL: "${NEXT_PUBLIC_KEYCLOAK_URL:-http://keycloak:8080}"
    depends_on:
      apigateway:
        condition: service_started
    networks:
      - order-network

volumes:
  postgres_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:

networks:
  order-network:
    driver: bridge
