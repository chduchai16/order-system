services:
  postgres:
    image: postgres:15
    container_name: order-system-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - order-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: order-system-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx256M"
    networks:
      - order-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: order-system-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_PORT: 8080
      JAVA_OPTS: "-Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m"
    ports:
      - "9090:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      - postgres
    networks:
      - order-network

  apigateway:
    build:
      context: .
      dockerfile: ./apigateway/Dockerfile
    container_name: order-system-apigateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      KEYCLOAK_SERVER_URL: "${KEYCLOAK_URL}"
      KEYCLOAK_ISSUER_URI: "${KEYCLOAK_URL}/realms/order"
      PRODUCT_SERVICE_URL: "${PRODUCT_SERVICE_URL}"
      USER_SERVICE_URL: "${USER_SERVICE_URL}"
      ORDER_SERVICE_URL: "${ORDER_SERVICE_URL}"
      PAYMENT_SERVICE_URL: "${PAYMENT_SERVICE_URL}"
      JAVA_TOOL_OPTIONS: "-Xms128M -Xmx192M -XX:+UseSerialGC -Xss256K"
    depends_on:
      - keycloak
    networks:
      - order-network

  userservice:
    build:
      context: .
      dockerfile: ./userservice/Dockerfile
    container_name: order-system-userservice
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/user_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      KEYCLOAK_SERVER_URL: "${KEYCLOAK_URL}"
      KEYCLOAK_CLIENT_SECRET: "${KEYCLOAK_CLIENT_SECRET}"
      JAVA_TOOL_OPTIONS: "-Xms128M -Xmx256M -XX:+UseSerialGC -Xss256K"
    depends_on:
      - postgres
      - kafka
      - keycloak
    networks:
      - order-network

  productservice:
    build:
      context: .
      dockerfile: ./productservice/Dockerfile
    container_name: order-system-productservice
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/product_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      JAVA_TOOL_OPTIONS: "-Xms128M -Xmx256M -XX:+UseSerialGC -Xss256K"
    depends_on:
      - postgres
      - kafka
    networks:
      - order-network

  orderservice:
    build:
      context: .
      dockerfile: ./orderservice/Dockerfile
    container_name: order-system-orderservice
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/order_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      PRODUCT_SERVICE_URL: "${PRODUCT_SERVICE_URL}"
      PAYMENT_SERVICE_URL: "${PAYMENT_SERVICE_URL}"
      USER_SERVICE_URL: "${USER_SERVICE_URL}"
      JAVA_TOOL_OPTIONS: "-Xms128M -Xmx256M -XX:+UseSerialGC -Xss256K"
    depends_on:
      - postgres
      - kafka
    networks:
      - order-network

  paymentservice:
    build:
      context: .
      dockerfile: ./paymentservice/Dockerfile
    container_name: order-system-paymentservice
    ports:
      - "8084:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/payment_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      JAVA_TOOL_OPTIONS: "-Xms128M -Xmx256M -XX:+UseSerialGC -Xss256K"
    depends_on:
      - postgres
      - kafka
    networks:
      - order-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: order-system-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_GATEWAY_URL: "${NEXT_PUBLIC_API_GATEWAY_URL}"
      NEXT_PUBLIC_KEYCLOAK_URL: "${NEXT_PUBLIC_KEYCLOAK_URL}"
    networks:
      - order-network

volumes:
  postgres_data:
  kafka_data:

networks:
  order-network:
    driver: bridge