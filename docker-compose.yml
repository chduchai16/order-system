services:
  # Postgres (Single Server - Multiple Databases)
  postgres:
    image: postgres:15
    container_name: order-system-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=200"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - order-network

  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: order-system-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - order-network

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: order-system-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - order-network

  # Keycloak DB
  postgres-keycloak:
    image: postgres:15
    container_name: order-system-postgres-keycloak
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    ports:
      - "5436:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    networks:
      - order-network

  # Keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: order-system-keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak_db
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "9090:8080"
    depends_on:
      - postgres-keycloak
    networks:
      - order-network

  # ==================== MICROSERVICES ====================

  # Eureka Discovery Server
  discoveryserver:
    build:
      context: .
      dockerfile: ./discoveryserver/Dockerfile
    container_name: order-system-discoveryserver
    ports:
      - "8061:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
    depends_on:
      - keycloak
    networks:
      - order-network

  # API Gateway
  apigateway:
    build:
      context: .
      dockerfile: ./apigateway/Dockerfile
    container_name: order-system-apigateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discoveryserver:8080/eureka"
      KEYCLOAK_SERVER_URL: "http://keycloak:8080"
      KEYCLOAK_ISSUER_URI: "http://keycloak:8080/realms/order"
    depends_on:
      - discoveryserver
      - keycloak
    networks:
      - order-network

  # Auth Service
  authservice:
    build:
      context: .
      dockerfile: ./authservice/Dockerfile
    container_name: order-system-authservice
    ports:
      - "8086:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discoveryserver:8080/eureka"
      KEYCLOAK_SERVER_URL: "http://keycloak:8080"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      KEYCLOAK_CLIENT_SECRET: "CJPgXLLB4ha8bIVTvRyQflm1LZKf1NcY"
    depends_on:
      keycloak:
        condition: service_started
      discoveryserver:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - order-network

  # User Service
  userservice:
    build:
      context: .
      dockerfile: ./userservice/Dockerfile
    container_name: order-system-userservice
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/user_db"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "password"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discoveryserver:8080/eureka"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discoveryserver:
        condition: service_started
    networks:
      - order-network

  # Product Service
  productservice:
    build:
      context: .
      dockerfile: ./productservice/Dockerfile
    container_name: order-system-productservice
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/product_db"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "password"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discoveryserver:8080/eureka"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discoveryserver:
        condition: service_started
    networks:
      - order-network

  # Order Service
  orderservice:
    build:
      context: .
      dockerfile: ./orderservice/Dockerfile
    container_name: order-system-orderservice
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/order_db"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "password"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discoveryserver:8080/eureka"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discoveryserver:
        condition: service_started
    networks:
      - order-network

  # Payment Service
  paymentservice:
    build:
      context: .
      dockerfile: ./paymentservice/Dockerfile
    container_name: order-system-paymentservice
    ports:
      - "8084:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/payment_db"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "password"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discoveryserver:8080/eureka"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discoveryserver:
        condition: service_started
    networks:
      - order-network

  # Notification Service
  notificationservice:
    build:
      context: .
      dockerfile: ./notificationservice/Dockerfile
    container_name: order-system-notificationservice
    ports:
      - "8085:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/notification_db"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "password"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discoveryserver:8080/eureka"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      discoveryserver:
        condition: service_started
    networks:
      - order-network

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: order-system-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_GATEWAY_URL: "http://apigateway:8080"
      NEXT_PUBLIC_KEYCLOAK_URL: "http://keycloak:8080"
    depends_on:
      apigateway:
        condition: service_started
    networks:
      - order-network

volumes:
  postgres_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  keycloak_db_data:

networks:
  order-network:
    driver: bridge
