version: "3.3"

services:
  postgres:
    image: postgres:15
    container_name: order-system-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - order-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: order-system-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx256M"
    networks:
      - order-network

  redis:
    image: redis:7.2-alpine
    container_name: order-system-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - order-network

  apigateway:
    build:
      context: .
      dockerfile: ./apigateway/Dockerfile
    container_name: order-system-apigateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      PRODUCT_SERVICE_URL: "http://host.docker.internal:8082"
      USER_SERVICE_URL: "http://host.docker.internal:8081"
      ORDER_SERVICE_URL: "http://host.docker.internal:8083"
      PAYMENT_SERVICE_URL: "http://host.docker.internal:8084"
      JAVA_TOOL_OPTIONS: "-Xms128M -Xmx192M -XX:+UseSerialGC -Xss256K"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - order-network

  userservice:
    build:
      context: .
      dockerfile: ./userservice/Dockerfile
    container_name: order-system-userservice
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/user_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "host.docker.internal:9094"
      JAVA_TOOL_OPTIONS: "-Xms128M -Xmx256M -XX:+UseSerialGC -Xss256K"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - kafka
    networks:
      - order-network

  productservice:
    build:
      context: .
      dockerfile: ./productservice/Dockerfile
    container_name: order-system-productservice
    ports:
      - "8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/product_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "host.docker.internal:9094"
      JAVA_TOOL_OPTIONS: "-Xms128M -Xmx256M -XX:+UseSerialGC -Xss256K"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - kafka
    networks:
      - order-network

  orderservice:
    build:
      context: .
      dockerfile: ./orderservice/Dockerfile
    container_name: order-system-orderservice
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/order_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "host.docker.internal:9094"
      PRODUCT_SERVICE_URL: "http://host.docker.internal:8082"
      PAYMENT_SERVICE_URL: "http://host.docker.internal:8084"
      USER_SERVICE_URL: "http://host.docker.internal:8081"
      JAVA_TOOL_OPTIONS: "-Xms128M -Xmx256M -XX:+UseSerialGC -Xss256K"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - kafka
    networks:
      - order-network

  paymentservice:
    build:
      context: .
      dockerfile: ./paymentservice/Dockerfile
    container_name: order-system-paymentservice
    ports:
      - "8084:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/payment_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "host.docker.internal:9094"
      JAVA_TOOL_OPTIONS: "-Xms128M -Xmx256M -XX:+UseSerialGC -Xss256K"
      VNP_TMN_CODE: "7JHR53F3"
      VNP_HASH_SECRET: "KS1VQ1270QKQ8A5FG0FD8NV4NBOYCM63"
      VNP_PAY_URL: "https://sandbox.vnpayment.vn/paymentv2/vpcpay.html"
      VNP_RETURN_URL: "http://localhost:8080/api/payment/vnpay-return"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - kafka
    networks:
      - order-network

  cartservice:
    build:
      context: .
      dockerfile: ./cartservice/Dockerfile
    container_name: order-system-cartservice
    ports:
      - "8085:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "host.docker.internal:9094"
      JAVA_TOOL_OPTIONS: "-Xms128M -Xmx256M -XX:+UseSerialGC -Xss256K"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - kafka
    networks:
      - order-network

  notificationservice:
    build:
      context: .
      dockerfile: ./notificationservice/Dockerfile
    container_name: order-system-notificationservice
    ports:
      - "8086:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/notification_db"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      JAVA_TOOL_OPTIONS: "-Xms128M -Xmx256M -XX:+UseSerialGC -Xss256K"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - kafka
    networks:
      - order-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: order-system-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_GATEWAY_URL: "${NEXT_PUBLIC_API_GATEWAY_URL}"
    networks:
      - order-network

volumes:
  postgres_data:
  kafka_data:
  redis_data:

networks:
  order-network:
    driver: bridge
