spring:
  application:
    name: orderservice

  datasource:
    url: jdbc:postgresql://postgres:5432/order_db
    username: postgres
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: orderservice-group

server:
  port: 8080


