spring:
  application:
    name: apigateway
  cloud:
    gateway:
        routes:
          - id: authservice
            uri: ${USER_SERVICE_URL:http://userservice:8080}
            predicates:
              - Path=/api/auth/**

          - id: userservice
            uri: ${USER_SERVICE_URL:http://userservice:8080}
            predicates:
              - Path=/api/users/**

          - id: productservice
            uri: ${PRODUCT_SERVICE_URL:http://productservice:8080}
            predicates:
              - Path=/api/products/**

          - id: orderservice
            uri: ${ORDER_SERVICE_URL:http://orderservice:8080}
            predicates:
              - Path=/api/orders/**

          - id: paymentservice
            uri: ${PAYMENT_SERVICE_URL:http://paymentservice:8080}
            predicates:
              - Path=/api/payments/**


  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/order}
          jwk-set-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/order}/protocol/openid-connect/certs

server:
  port: 8080
