spring:
  application:
    name: paymentservice
  config:
    import: optional:file:.env[.properties],optional:file:./.env[.properties],optional:file:../.env[.properties],optional:file:.env.properties,optional:file:./.env.properties,optional:file:paymentservice/.env.properties,optional:file:./paymentservice/.env.properties,optional:file:../paymentservice/.env.properties
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: paymentservice-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: stockReservedEvent:com.example.commonlib.events.stock.StockReservedEvent
        spring.json.trusted.packages: com.example.commonlib.events,com.example.commonlib.events.*

server:
  port: ${SERVER_PORT:8084}

payment:
  bank:
    code: ${PAYMENT_BANK_CODE:ICB}
    name: ${PAYMENT_BANK_NAME:VietinBank}
    account-number: ${PAYMENT_ACCOUNT_NUMBER:}
    account-name: ${PAYMENT_ACCOUNT_NAME:}
  transfer:
    prefix: ${PAYMENT_TRANSFER_PREFIX:SEVQR}
    ttl-minutes: ${PAYMENT_TRANSFER_TTL_MINUTES:30}
