spring:
  application:
    name: paymentservice

  datasource:
    url: jdbc:postgresql://postgres:5432/payment_db
    username: postgres
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    consumer:
      group-id: paymentservice-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: stockReservedEvent:com.example.commonlib.events.stock.StockReservedEvent
        spring.json.trusted.packages: com.example.commonlib.events,com.example.commonlib.events.*

server:
  port: 8080

payment:
  bank:
    code: ${PAYMENT_BANK_CODE:ICB}
    name: ${PAYMENT_BANK_NAME:VietinBank}
    account-number: ${PAYMENT_ACCOUNT_NUMBER:}
    account-name: ${PAYMENT_ACCOUNT_NAME:}
  transfer:
    prefix: ${PAYMENT_TRANSFER_PREFIX:SEVQR}
    ttl-minutes: ${PAYMENT_TRANSFER_TTL_MINUTES:30}


