spring:
  application:
    name: paymentservice

  datasource:
    url: jdbc:postgresql://postgres:5432/payment_db
    username: postgres
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: paymentservice-group

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://discoveryserver:8080/eureka/
  instance:
    hostname: paymentservice
    prefer-ip-address: false
