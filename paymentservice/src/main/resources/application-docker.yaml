spring:
  application:
    name: paymentservice

  datasource:
    url: jdbc:postgresql://postgres:5432/payment_db
    username: postgres
    password: password

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      group-id: paymentservice-group

server:
  port: 8080

vnpay:
  tmn-code: ${VNP_TMN_CODE}
  secret-key: ${VNP_HASH_SECRET}
  pay-url: ${VNP_PAY_URL}
  return-url: ${VNP_RETURN_URL}


