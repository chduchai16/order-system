spring:
  application:
    name: notificationservice
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notificationservice-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.type.mapping: userRegisteredIntegrationEvent:com.example.commonlib.events.UserRegisteredIntegrationEvent,orderCreatedEvent:com.example.commonlib.events.OrderCreatedEvent
        spring.json.trusted.packages: com.example.commonlib.events

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8061/eureka/
  instance:
    hostname: host.docker.internal
    prefer-ip-address: false
